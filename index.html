<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IA Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900">

  <main class="min-h-screen flex flex-col items-center justify-center gap-6">
    <h1 class="text-4xl font-bold">IA Hub</h1>

    <textarea
      id="prompt"
      class="w-full max-w-xl p-4 border rounded-xl"
      placeholder="Entre ton prompt..."
    ></textarea>

    <button
      id="generate"
      class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold"
    >
      Générer
    </button>

    <div
      id="output"
      class="hidden max-w-xl w-full p-4 bg-white border rounded-xl"
    ></div>
  </main>

  <!-- JS séparé -->
  <script src="js/app.js"></script>
</body>
</html>
